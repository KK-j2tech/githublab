name: main
on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: Dev
  APP_USER: kiran
  APP_Port: 80
  
jobs:
  job1:
   name: job1
   runs-on: ubuntu-latest
   steps:
     - name: step1
       run: |
        pwd
        hostname
        ls -ltr
     - name: step2 - checkout
       uses: actions/checkout@v6.0.0
     - name: step3
       run: |
        echo 'pwd' >> myartifact.txt
        mkdir -p artifacts
        echo 'ls -ltr' >> artifacts/list.txt
        echo 'hostname' >> artifacts/hostname.txt
     - name: upload single file
       uses: actions/upload-artifact@v6.0.0
       with:
          name: single_file
          path: ./myartifact.txt
     - name: upload from directory
       uses: actions/upload-artifact@v6.0.0
       with:
         name: directory_artifact
         path: artifacts/
     - name: upload from multiple paths
       uses: actions/upload-artifact@v6.0.0
       with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
     - name: upload from multiple path with exculsion
       uses: actions/upload-artifact@v6.0.0
       with:
         name: multiple_paths_with_exclusions
         path: |
           ./myartifact.txt
           artifacts/
           !**/hostname.txt
  job2:
   name: job2
   needs: job1
   runs-on: ubuntu-latest
   steps:
    - name: step1- checking current directory
      run: |
        pwd
        ls -ltr
    - name: download artifact
      uses: actions/download-artifact@v6.0.0
      with:
        name: single_file
    - name: checking current directory post download
      run: |
        pwd
        ls -ltr
    - name: Testing environment variables
      run: |
         echo "testing enviroment variables in paltform $ENV_TYPE of user name is $APP_USER"
         echo "this app works on port $APP_Port"
    - name: app secerts test
      run: echo "applying secerts ${{ secrets.APP_PASSWORD }}" 
  job3:
   name: job3
   runs-on: ubuntu-latest
   steps:
     - name: context test
       run: |
         echo "This is texting of ${{ github.actor }}"
         echo "understand workflow ${{ github.event_name }}"
         echo " which OS is ${{ runner.os }}"
         echo " Type of runner is ${{ runner.environment }}"
  staging:
   name: Deploy into staging environment
   runs-on: ubuntu-latest
   steps:
     - name: reffering env variables
       run: |
         echo "refereing enviorment ${{ vars.HOST }} with user ${{ vars.USER }}"
     - name: reffering env password
       run: echo "refereing user ${{ vars.USER }} and password ${{ secrets.PASSWORD }}"
   environment: 
     name: staging
   if: github.head_ref == 'dev'
  production:
   name: Deploy into prod environment
   runs-on: ubuntu-latest
   steps:
     - name: reffering env variables
       run: |
         echo "refereing enviorment ${{ vars.HOST }} with user ${{ vars.USER }}"
     - name: reffering env password
       run: echo "refereing user ${{ vars.USER }} and password ${{ secrets.PASSWORD }}"
   environment: 
     name: PRODUCTION
   if: github.ref == 'refs/heads/main'
