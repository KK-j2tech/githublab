name: main
on: push

jobs:
  job1:
   name: job1
   runs-on: ubuntu-latest
   steps:
     - name: step1
       run: |
        pwd
        hostname
        ls -ltr
     - name: step2 - checkout
       uses: actions/checkout@v6.0.0
     - name: step3
       run: |
        echo 'pwd' >> myartifact.txt
        mkdir -p artifacts
        echo 'ls -ltr' >> artifacts/list.txt
        echo 'hostname' >> artifacts/hostname.txt
     - name: upload single file
       uses: actions/upload-artifact@v6.0.0
       with:
          name: single_file
          path: ./myartifact.txt
     - name: upload from directory
       uses: actions/upload-artifact@v6.0.0
       with:
         name: directory_artifact
         path: artifacts/
     - name: upload from multiple paths
       uses: actions/upload-artifact@v6.0.0
       with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
     - name: upload from multiple path with exculsion
       uses: actions/upload-artifact@v6.0.0
       with:
         name: multiple_paths_with_exclusions
         path: |
           ./myartifact.txt
           artifacts/
           !**/hostname.txt
  job2:
   name: job2
   needs: job1
   runs-on: ubuntu-latest
   steps:
    - name: step1- checking current directory
      run: |
        pwd
        ls -ltr
    - name: download artifact
      uses: actions/download-artifact@v6.0.0
      with:
        name: single_file
    - name: checking current directory post download
      run: |
        pwd
        ls -ltr
  job3:
   name: job3
   needs: job1
   runs-on: ubuntu-latest
   steps:
     - name: step1 - creating custom location
       run: |
         mkdir -p multiplefiles_directory
     - name: step2 - checking current directory
       run: |
         pwd
         ls -ltr
     - name: download directory artifact
       uses: actions/download-artifact@v6.0.0
       with:
         name: directory_artifact
         path: multiplefiles_directory
     - name: checking current directory post check
       run: |
         pwd
         ls -ltr
  
