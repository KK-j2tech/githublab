name: main
on: push

jobs:
  job1:
   name: JOB1
   runs-on: ubuntu-latest
   steps:
     - name: step1
       run: |
            pwd
            hostname
            ls -ltr
     - name: step2 - checkout
       uses: actions/checkout@v6.0.2
     - name: step3
       run: |
             echo 'pwd' >> ./workingdirectory.txt
             mkdir artifact
             echo 'hostname' >> artifact/hostname.txt
             echo 'ls -ltr' >> artifact/list.txt
     - name: upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: pwd file
         path: |
            ./workingdirectory.txt
            artifact/
     - name: upload artifact
       uses: actions/upload-artifact@v4
       with:
         name: pwd file
         path: |
            ./workingdirectory.txt
            artifact/
            !**/hostname.txt
